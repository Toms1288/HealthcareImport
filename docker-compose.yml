services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./data:/data
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    env_file:
      - .env
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  python_service:
    build:
      context: .
    container_name: python_service
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - app_network
    
volumes:
  mongodb_data:

networks:
  app_network:
    driver: bridge