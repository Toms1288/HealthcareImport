services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      # - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - ./data:/data
    env_file:
      - .env
    networks:
      - app-network

  python_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_service
    depends_on:
      - mongodb
    volumes:
      - ./script:/script
      - ./data:/data
    env_file:
      - .env
    networks:
      - app-network
    environment:
      MONGO_URI: mongodb://mongodb:27017
    
volumes:
  mongodb_data:
  app:

networks:
  app-network:
    driver: bridge